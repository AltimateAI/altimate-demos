models:
  - name: fct_daily_kpis
    description: The 'daily_users_kpi' model provides a daily snapshot of key performance indicators (KPIs) related to user activity and subscriptions. It includes the total number of users, the number of users contacted on the current day, the number of active subscriptions, the total number of activities, and the number of specific activities such as logins, logouts, and posts. This model is essential for understanding daily user engagement and subscription status, which can help in making strategic business decisions.
    columns:
      - name: day
        description: This column represents the specific date for which the data is being reported. It is in the format of YYYY-MM-DD.
        data_type: date
        tests:
          - unique
          - not_null
      - name: number_users
        description: This column indicates the total number of users who have accessed our platform on the given day. It includes both new and returning users.
        data_type: bigint
      - name: number_logins
        description: This column indicates the total number of times users have logged into the platform on the current day. Each login is counted as a separate activity.
        data_type: bigint
  - name: fct_user_activities
    description: "The 'fct_user_activities' model is a comprehensive view of user activities within our system. It combines data from the 'users' and 'stg_postgres__activity' tables to provide a detailed overview of each user's activities. The model includes the following columns: 'id', 'email', 'activity_type', and 'number_of_activities'. The 'id' is a unique identifier for each activity, created by concatenating the 'user_id' and 'activity_type'. The 'email' is the user's email address. The 'activity_type' indicates the type of activity the user has performed, and 'number_of_activities' is a count of how many times the user has performed that specific activity. This model is particularly useful for understanding user behavior and engagement within our platform."
    columns:
      - name: email
        description: This field contains the email address of the user. It is a string of characters and is used for communication purposes. It is also unique for each user, meaning no two users can have the same email address in our system.
        data_type: string
        tests:
          - not_null
          - unique
      - name: type
        description: This column represents the type of activity that the user has engaged in. It is a string value that can vary depending on the different types of activities available in the system. This information is crucial for understanding user behavior and preferences.
        data_type: string
        quote: true
      - name: number_of_activities
        description: This column represents the total number of activities that a user has performed. It is calculated by counting the number of entries in the 'activities' table for each user. This information can be useful for understanding user engagement and activity levels.
        data_type: int64
      - name: last_activity_date
        description: This column represents the date and time of the most recent activity performed by the user. It is recorded in a timestamp format. This information can be useful to understand the user's recent engagement with our platform.
        data_type: timestamp
  - name: dim_activities
    description: "The 'dim_activities' model is a transformation of the 'stg_postgres__activity' table from the 'dbt_patricia_staging' dataset. It provides a simplified view of user activities, with each row representing a unique activity. The model includes the following columns: 'id' (the unique identifier for each activity), 'user_id' (the identifier for the user who performed the activity), 'type' (the type of activity performed), 'description' (a brief description of the activity), and 'date' (the date when the activity was performed). This model is useful for analyzing user behavior and activity trends over time."
    columns:
      - name: id
        description: This is a unique identifier for each activity. It is used to distinguish one activity from another and is crucial for tracking and analysis purposes.
        data_type: int64
        quote: true
        tests:
          - not_null
          - unique
      - name: user_id
        description: This is a unique identifier for each user in our system. It is an
          integer value and is automatically generated when a new user is
          created. This field is used to link user data across different tables
          and databases.
        data_type: int64
        quote: true
      - name: type
        description: This column represents the type of activity that the user has engaged in. It is a string value that can vary depending on the different types of activities available in the system. This information is crucial for understanding user behavior and preferences.
        data_type: string
        quote: true
      - name: description
        description: This column contains a brief summary of the activity that the user has performed. It provides a textual explanation of the user's actions, which can be useful for understanding user behavior and trends.
        data_type: string
        quote: true
      - name: date
        description: This column records the date and time when the activity was performed by the user. It is stored in a timestamp format, allowing for precise tracking of user activities over time.
        data_type: timestamp
        quote: true
  - name: dim_users
    columns:
      - name: user_id
        description: This is a unique identifier for each user in our system. It is an
              integer value and is automatically generated when a new user is
              created. This field is used to link user data across different tables
              and databases.
        data_type: int64
        quote: true
        tests:
          - not_null
          - unique
      - name: email
        description: This field contains the email address of the user. It is a string of characters and is used for communication purposes. It is also unique for each user, meaning no two users can have the same email address in our system.
        data_type: string
        quote: true
      - name: username
        description: This is the username chosen by the user when they create their account. It is a string value and is unique for each user. This field is used for login purposes and to personalize the user experience.
        data_type: string
        quote: true
      - name: name
        description: This column represents the full name of the user. It is a combination of the user's first and last name from the Salesforce database.
        data_type: string
        quote: true
      - name: phone
        description: This column contains the phone number of the user as recorded in the Salesforce database. It can be used for contacting the user directly.
        data_type: string
        quote: true
      - name: address
        description: This column holds the address of the user as recorded in the Salesforce database. It can be used for sending physical mail or for geographical analysis.
        data_type: string
        quote: true
      - name: is_active
        description: This field indicates whether the user's account is currently active or not. If the value is 'true', it means the user's account is active. If the value is 'false', it means the user's account is not active.
        data_type: boolean
        quote: true
      - name: last_contacted_date
        description: This field represents the last date when the user was contacted. It is recorded in the format of 'YYYY-MM-DD HH:MM:SS'. This information can be useful to understand the user's recent engagement with our services.
        data_type: timestamp
        quote: true
      - name: created_date
        description: This field represents the date when the user's account was created. It is recorded in the format of 'YYYY-MM-DD HH:MM:SS'. This information can be useful to understand how long the user has been with us.
        data_type: timestamp
        quote: true
      - name: modified_date
        description: This column represents the date and time when the user's information was last updated in the system. It is useful for tracking changes in user data over time.
        data_type: timestamp
        quote: true
      - name: created_at
        description: This column indicates the date and time when the user's record was first created in the system. It helps in understanding when the user first became part of our database.
        data_type: timestamp
        quote: true
      - name: number_of_activities
        description: This column represents the total number of activities that a user has performed. It is calculated by counting the number of entries in the 'activities' table for each user. This information can be useful for understanding user engagement and activity levels.
        data_type: int64
        quote: true
    description: "This model provides a comprehensive view of user data, combining information from both Salesforce and Postgres databases. It includes user identification, contact information, activity count, and status. The fields are as follows: 'user_id' is the unique identifier for each user. 'email', 'username', 'name', 'phone', and 'address' provide contact information. 'is_active' indicates whether the user is currently active. 'last_contacted_date' shows the last date the user was contacted. 'created_date' and 'modified_date' provide timestamps for when the user record was created and last updated. 'created_at' is the timestamp from the Postgres database. The 'number_of_activities' field, derived from the 'activity_by_user' subquery, shows the total number of activities associated with each user."
  - name: dim_orders
    description: "This model provides a comprehensive view of all orders, including details about the customer, payment, discounts, and refunds. It includes the following columns: order_id, order_date, status, gross_revenue, total_discount, total_refunded, net_revenue, total_paid, payment_methods, email, and username. The gross_revenue column represents the total amount of the order before any discounts or refunds. The total_discount column represents the total amount of discounts applied to the order. The total_refunded column represents the total amount refunded for the order. The net_revenue column represents the final amount after applying discounts and refunds. The total_paid column represents the total amount paid by the customer. The payment_methods column represents the methods used by the customer to pay for the order. The email and username columns represent the customer's email and username respectively."
    columns:
      - name: order_id
        data_type: string
        quote: true
        description: This is a unique identifier for each discount in our system.
              It is an integer value and is automatically generated when a new
              discount is created. This field is used to link discount data across
              different tables and databases.
        tests:
          - not_null
      - name: order_date
        data_type: date
        description: This is the date when the order was placed by the customer. It is stored in the 'date' format. This information is crucial for analyzing sales trends, forecasting future sales, and managing inventory.
        quote: true
      - name: status
        data_type: string
        description: This is the current status of the order. It is a string value that can take on several states such as 'pending', 'processing', 'shipped', 'delivered', 'cancelled', etc. This information is important for tracking the progress of an order and for customer service purposes.
        quote: true
      - name: gross_revenue
        data_type: numeric
        quote: true
        description: This column represents the total amount of revenue generated from an order before any discounts or refunds are applied. It is calculated by summing up the total amount of all items in an order. This is a crucial metric for understanding the initial income generated from sales.
      - name: total_discount
        data_type: numeric
        quote: true
        description: This column shows the total amount of discounts applied to an order. It is calculated by summing up all the discount amounts associated with an order. This metric is important for understanding the total savings provided to customers and its impact on the gross revenue.
      - name: total_refunded
        data_type: numeric
        quote: true
        description: This column represents the total amount refunded for an order. It is calculated by summing up all the refund amounts associated with an order. This metric is important for understanding the total amount returned to customers due to cancellations or returns, and its impact on the net revenue.
      - name: net_revenue
        data_type: numeric
        quote: true
        description: This column represents the net revenue generated from each order. It is calculated by subtracting the total discount and total refund from the gross revenue. This metric is crucial for understanding the actual income generated from each transaction, after accounting for any discounts or refunds provided to the customer.
      - name: total_paid
        data_type: numeric
        quote: true
        description: This column indicates the total amount paid by the customer for each order. It is derived from the payments table and provides insights into the customer's spending behavior. If no payment record exists, this column defaults to 0 to ensure data consistency.
        tests:
          - not_null
      - name: payment_methods
        data_type: string
        quote: true
        description: This column lists the payment method(s) used by the customer for each order. It is extracted from the payments table and defaults to 'unknown' when no payment record exists. This information can be useful for understanding customer payment preferences and trends while maintaining data consistency.
        tests:
          - not_null
      - name: email
        data_type: string
        description: This field contains the email address of the user. It is a string of characters and is used for communication purposes. It is also unique for each user, meaning no two users can have the same email address in our system.
        quote: true
      - name: username
        data_type: string
        description: This is the username chosen by the user when they create their account. It is a string value and is unique for each user. This field is used for login purposes and to personalize the user experience.
        quote: true
  - name: fct_users
    description: "This model provides a daily count of users. It is derived from the 'stg_postgres__user' staging table and groups the data by the date the user was created. The model contains two columns: 'created_date' and 'count_users'. The 'created_date' column represents the date a user was created, and the 'count_users' column represents the total number of users created on that date."
    columns:
      - name: created_date
        description: This field represents the date when the user's account was created. It is recorded in the format of 'YYYY-MM-DD HH:MM:SS'. This information can be useful to understand how long the user has been with us.
        data_type: date
        tests:
          - not_null
          - unique
        quote: true
      - name: count_users
        description: This column represents the total number of users created on a particular date. It is calculated by counting the number of records in the 'stg_postgres__user' table for each date. This metric is crucial for understanding the growth of our user base over time.
        data_type: int64
        quote: true
