models:
  - name: stg_google_sheets__subscription
    description: The stg_google_sheets__subscription model is a transformation of the raw subscription data from Google Sheets. It includes the user_id, a boolean field indicating whether the subscription is active, and the start and end dates of the subscription. The 'is_active' field is derived from the 'status' field in the source data, with 'active' status mapped to TRUE and any other status mapped to FALSE.
    columns:
      - name: user_id
        description: This is a unique identifier for each user in our system. It is an
              integer value and is automatically generated when a new user is
              created. This field is used to link user data across different tables
              and databases.
        data_type: int64
        quote: true
        tests:
          - not_null
          - unique
      - name: is_active
        description: This field indicates whether the user's account is currently active or not. If the value is 'true', it means the user's account is active. If the value is 'false', it means the user's account is not active.
        data_type: boolean
        quote: true
      - name: start_date
        description: This is the date when the user's subscription started. It is in the format 'YYYY-MM-DD'. This field helps us understand when the user began their subscription.
        data_type: date
        quote: true
      - name: end_date
        description: This column represents the date when a user's subscription ended. It is in date format (YYYY-MM-DD). If a user's subscription is still active, this field will be null.
        data_type: date
        quote: true
  - name: base_salesforce_users
    description: "The 'base_salesforce_users' model is a transformation of the 'users' table from the 'salesforce' schema in the 'ace-ellipse-229218' project. It includes the following columns: 'user_id', 'first_name', 'last_name', 'email', 'phone', 'address', 'last_contacted_date', 'created_date', 'modified_date', and 'is_active'. These columns provide comprehensive information about each user, including their contact details, the last time they were contacted, when their record was created and last modified, and whether their account is currently active."
    columns:
      - name: user_id
        description: This is a unique identifier for each user in our system. It is an integer value and is automatically generated when a new user is created. This field is used to link user data across different tables and databases.
        data_type: INT64
        tests:
          - unique
          - not_null
      - name: first_name
        description: This is the first name of the user. It is a string value and is manually entered by the user or an administrator when the user profile is created or updated.
        data_type: STRING
      - name: last_name
        description: This is the last name of the user. Similar to the first name, it is a string value and is manually entered by the user or an administrator when the user profile is created or updated.
        data_type: STRING
      - name: email
        description: This field contains the email address of the user. It is a string of characters and is used for communication purposes. It is also unique for each user, meaning no two users can have the same email address in our system.
        data_type: STRING
      - name: phone
        description: This column contains the phone number of the user as recorded in the Salesforce database. It can be used for contacting the user directly.
        data_type: STRING
      - name: address
        description: This column holds the address of the user as recorded in the Salesforce database. It can be used for sending physical mail or for geographical analysis.
        data_type: STRING
      - name: last_contacted_date
        description: This field represents the last date when the user was contacted. It is recorded in the format of 'YYYY-MM-DD HH:MM:SS'. This information can be useful to understand the user's recent engagement with our services.
        data_type: DATE
      - name: created_date
        description: This field represents the date when the user's account was created. It is recorded in the format of 'YYYY-MM-DD HH:MM:SS'. This information can be useful to understand how long the user has been with us.
        data_type: TIMESTAMP
      - name: modified_date
        description: This column represents the date and time when the user's information was last updated in the system. It is useful for tracking changes in user data over time.
        data_type: TIMESTAMP
      - name: is_active
        description: This field indicates whether the user's account is currently active or not. If the value is 'true', it means the user's account is active. If the value is 'false', it means the user's account is not active.
        data_type: BOOLEAN
  - name: stg_salesforce__refunds
    description: "This model provides a simplified view of the refunds data sourced from Salesforce. It includes two key columns: 'order_id' and 'refund_amount'. The 'order_id' column represents the unique identifier for each order, while the 'refund_amount' column indicates the amount refunded for that particular order."
    columns:
      - name: order_id
        description: This is a unique identifier for each discount in our system.
              It is an integer value and is automatically generated when a new
              discount is created. This field is used to link discount data across
              different tables and databases.
        data_type: string
        tests:
          - not_null
          - unique
        quote: true
      - name: refund_amount
        description: This column represents the total amount refunded for a particular order. It is a numeric value that is derived from the 'refunds' table in the Salesforce database. This information is crucial for understanding the financial impact of refunds on overall sales and revenue.
        data_type: numeric
        quote: true
  - name: stg_salesforce__discounts
    description: "This model provides a view of the discounts data sourced from Salesforce. It includes two key columns: 'order_id' and 'discount_amount'. The 'order_id' column represents the unique identifier for each order, while the 'discount_amount' column indicates the amount of discount applied to each order."
    columns:
      - name: order_id
        description: This is a unique identifier for each discount in our system.
              It is an integer value and is automatically generated when a new
              discount is created. This field is used to link discount data across
              different tables and databases.
        data_type: string
        tests:
          - not_null
          - unique
        quote: true
      - name: discount_amount
        description: This numeric value represents the amount of discount applied to a particular order. It is calculated based on the discount policies and rules set by the business.
        data_type: numeric
        quote: true
models:
  - name: stg_postgres__activity
    description: "The 'stg_postgres__activity' model is a transformation of the 'activity' table from the 'postgres' database. It contains information about various activities performed by users. The model includes the following columns: 'activity_id', 'user_id', 'activity_type', 'activity_date', and 'activity_description'. 'activity_id' is a unique identifier for each activity. 'user_id' represents the unique identifier of the user who performed the activity. 'activity_type' describes the type of activity performed. 'activity_date' is the date when the activity was performed. 'activity_description' provides a detailed description of the activity."
    columns:
      - name: activity_id
        description: This is a unique identifier for each activity that a user performs. It is an integer value and is automatically generated by the system for each new activity.
        data_type: int64
        tests:
          - not_null
          - unique
      - name: user_id
        description: This is a unique identifier for each user in our system. It is an
              integer value and is automatically generated when a new user is
              created. This field is used to link user data across different tables
              and databases.
        data_type: int64
      - name: activity_type
        description: This column describes the type of activity performed by the user. It can include various actions like 'login', 'logout', 'purchase', etc. This information is crucial for understanding user behavior and engagement patterns.
        data_type: string
        tests:
          - accepted_values:
              values:
                - login
                - logout
                - post
      - name: activity_date
        description: This column represents the date and time when the activity occurred. It is recorded in the TIMESTAMP format, which includes both the date and time. This information can be useful for understanding user behavior patterns and trends over time.
        data_type: timestamp
      - name: activity_description
        description: This column provides a brief description of the user's activity. It is a text field that can include various types of information depending on the activity type. This can be used to gain more context about the user's actions and behavior.
        data_type: string
  - name: stg_postgres__user
    description: "The 'stg_postgres__user' model is a simplified and renamed version of the original 'user' table from the 'postgres' database. It includes four key fields: 'user_id', 'username', 'email', and 'created_at'. 'user_id' is a unique identifier for each user. 'username' is the chosen name of the user. 'email' is the email address associated with the user. 'created_at' is the timestamp indicating when the user was created. This model is designed to provide a clear and concise view of user data for business users."
    columns:
      - name: user_id
        description: This is a unique identifier for each user in our system. It is an
              integer value and is automatically generated when a new user is
              created. This field is used to link user data across different tables
              and databases.
        data_type: INT64
        tests:
          - unique
          - not_null
      - name: username
        description: This is the username chosen by the user when they create their account. It is a string value and is unique for each user. This field is used for login purposes and to personalize the user experience.
        data_type: STRING
      - name: email
        description: This field contains the email address of the user. It is a string of characters and is used for communication purposes. It is also unique for each user, meaning no two users can have the same email address in our system.
        data_type: STRING
      - name: created_at
        description: This column indicates the date and time when the user's record was first created in the system. It helps in understanding when the user first became part of our database.
        data_type: TIMESTAMP
  - name: stg_postgres__payments
    description: "This model is a transformation of the 'payments' table from the Postgres database. It includes three columns: 'order_id', 'amount', and 'payment_method'. The 'order_id' column represents the unique identifier for each order. The 'amount' column represents the total amount paid for the order. The 'payment_method' column indicates the method used for payment."
    columns:
      - name: order_id
        description: This is a unique identifier for each discount in our system.
              It is an integer value and is automatically generated when a new
              discount is created. This field is used to link discount data across
              different tables and databases.
        data_type: string
        tests:
          - unique
          - not_null
        quote: true
      - name: amount
        description: This represents the total amount of the order. It is a numeric value that includes the total cost of the items purchased in the order.
        data_type: numeric
        quote: true
      - name: payment_method
        description: This indicates the method of payment used for the order. It is a string value that can include various payment methods such as credit card, debit card, PayPal, etc.
        data_type: string
        quote: true
  - name: stg_postgres__orders
    description: "This model is a transformation of the 'orders' table from the 'postgres' database. It includes the following columns: 'order_id', 'user_id', 'order_date', 'status', and 'total_amount'. The 'order_id' column is a unique identifier for each order. The 'user_id' column identifies the user who placed the order. The 'order_date' column indicates when the order was placed. The 'status' column shows the current status of the order. The 'total_amount' column represents the total amount of the order."
    columns:
      - name: order_id
        description: This is a unique identifier for each discount in our system.
              It is an integer value and is automatically generated when a new
              discount is created. This field is used to link discount data across
              different tables and databases.
        data_type: string
        quote: true
        tests:
          - not_null
          - unique
      - name: user_id
        description: This is a unique identifier for each user in our system. It is an
              integer value and is automatically generated when a new user is
              created. This field is used to link user data across different tables
              and databases.
        data_type: int64
        quote: true
      - name: order_date
        description: This is the date when the order was placed by the customer. It is stored in the 'date' format. This information is crucial for analyzing sales trends, forecasting future sales, and managing inventory.
        data_type: date
        quote: true
      - name: status
        description: This is the current status of the order. It is a string value that can take on several states such as 'pending', 'processing', 'shipped', 'delivered', 'cancelled', etc. This information is important for tracking the progress of an order and for customer service purposes.
        data_type: string
        quote: true
      - name: total_amount
        description: This column represents the total amount of an order. It is a numeric value that includes the cost of all items in the order, taxes, and any additional charges. This information is vital for financial analysis and revenue tracking.
        data_type: numeric
        quote: true
